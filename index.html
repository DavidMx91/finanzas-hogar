<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="robots" content="noindex">
<script>(function(){var f="pistache";try{f=localStorage.getItem("fh-fondo")||"pistache"}catch(e){}var r=document.documentElement;r.dataset.fondo=f;if(f!=="clasico")r.dataset.theme="light";})()</script>
<title>Finanzas del Hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: libreta de casa — encabezado con mes, pestañas, tarjetas sólo donde hay un objeto (deuda, pago); botón fijo para registrar */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#15201C; --muted:#5A6964; --line:#DCE3E0; --soft:#EAF2EF;
  --accent:#0F6E58; --accent-ink:#FFFFFF;
  --inc:#16856A; --exp:#C96F12;
  --good:#1E7F4F; --warn:#9A6312; --bad:#B8362A; --warn-bg:#FBF1E1; --bad-bg:#FBE9E7; --good-bg:#E5F3EB;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17201D; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3632; --soft:#1D2925;
  --accent:#3FB894; --accent-ink:#08130F;
  --inc:#2AA583; --exp:#D27C1E;
  --good:#5BC890; --warn:#E3AE55; --bad:#EE7466; --warn-bg:#2E2414; --bad-bg:#331B18; --good-bg:#15291F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17201D; --ink:#E6EEEA; --muted:#93A39D; --line:#2A3632; --soft:#1D2925;
  --accent:#3FB894; --accent-ink:#08130F;
  --inc:#2AA583; --exp:#D27C1E;
  --good:#5BC890; --warn:#E3AE55; --bad:#EE7466; --warn-bg:#2E2414; --bad-bg:#331B18; --good-bg:#15291F;
  color-scheme:dark}
/* Fondos elegibles (se guardan por dispositivo) */
:root[data-fondo="pistache"]{--bg:#E2EFCF;--surface:#F8FBF2;--soft:#D4E7BD;--line:#C2D8A6;--muted:#53634A}
:root[data-fondo="azul"]{--bg:#B9C9DA;--bg-img:linear-gradient(165deg,#D5E0EB 0%,#AFC1D4 42%,#C9D6E3 68%,#A3B6CA 100%);--surface:#F4F7FA;--soft:#DCE5EE;--line:#B3C3D3;--muted:#3E4B59}
@media (prefers-color-scheme: dark){
  :root[data-fondo="pistache"]:not([data-theme="light"]){--bg:#152014;--surface:#1D2A1B;--soft:#263723;--line:#314630;--muted:#9FB396}
  :root[data-fondo="azul"]:not([data-theme="light"]){--bg:#1A2533;--bg-img:linear-gradient(165deg,#26364D 0%,#1A2533 48%,#24354B 75%,#18222F 100%);--surface:#223044;--soft:#2B3B51;--line:#35485F;--muted:#A0B1C5}
}
:root[data-fondo="pistache"][data-theme="dark"]{--bg:#152014;--surface:#1D2A1B;--soft:#263723;--line:#314630;--muted:#9FB396}
:root[data-fondo="azul"][data-theme="dark"]{--bg:#1A2533;--bg-img:linear-gradient(165deg,#26364D 0%,#1A2533 48%,#24354B 75%,#18222F 100%);--surface:#223044;--soft:#2B3B51;--line:#35485F;--muted:#A0B1C5}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .box{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login h1{font-size:2rem}
.login .btn{padding:12px 20px;font-size:1rem}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:.8rem;text-decoration:underline}
body{background:var(--bg-img,var(--bg));color:var(--ink);min-height:100vh;font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:1.1rem}
.monthnav button:hover{background:var(--soft)}
.monthnav span{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
.status{font-size:.8rem;color:var(--muted)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.45rem;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;margin-top:28px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* barras por categoría */
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:6px 0}
.catrow .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .amt{text-align:right;font-weight:600}
.bar{grid-column:1/-1;position:relative;height:8px;background:var(--soft);border-radius:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--exp)}
.bar i.over{background:var(--bad)}
.bar i.near{background:var(--warn)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.catrow .meta{grid-column:1/-1;font-size:.78rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--soft);color:var(--muted)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .d{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .m{font-weight:700;text-align:right;white-space:nowrap}
.item.click{cursor:pointer}
.item.click:hover .t{color:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--ink)}
.dayhead{font-size:.78rem;font-weight:600;color:var(--muted);padding-top:14px;text-transform:capitalize}

/* gráfica de tendencia */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:420px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:8px 10px;border-radius:8px;z-index:60;line-height:1.4;max-width:220px}

/* deudas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.debt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.debt .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.debt .saldo{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.progress{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.84rem}
.facts div span{display:block;color:var(--muted);font-size:.74rem}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.filters input{flex:1 1 160px}

table.budget{width:100%;border-collapse:collapse}
table.budget td,table.budget th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
table.budget th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.budget td.n,table.budget th.n{text-align:right}
table.budget input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right}
.tablewrap{overflow-x:auto}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:.85rem}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:999px;color:var(--muted)}
.chip button:hover{background:var(--line);color:var(--bad)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 180px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:1.05rem}

.notice{padding:12px 14px;border-radius:10px;font-size:.88rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet{border-radius:18px;padding:24px}}
.sheet form{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.field input.big{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:440px){.seg{grid-template-columns:repeat(2,1fr)}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0}
.thumb .load{font-size:.7rem;color:var(--muted);display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet .actions .right{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:70;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <h1>Finanzas del Hogar</h1>
    <p class="muted" id="loginMsg">Entra con tu cuenta de Google para ver y registrar los gastos de la casa.</p>
    <button class="btn primary" id="loginBtn">Entrar con Google</button>
    <button class="linkbtn" id="loginOther" hidden>Usar otra cuenta</button>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Finanzas del Hogar</h1>
      <div class="who"><span class="status" id="status">Conectando…</span><button class="linkbtn" id="logout" hidden>Salir</button></div>
    </div>
    <div class="monthnav" role="group" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="mlabel"></span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="resumen" aria-selected="true">Resumen</button>
    <button role="tab" data-tab="movs" aria-selected="false">Movimientos</button>
    <button role="tab" data-tab="cuentas" aria-selected="false">Cuentas</button>
    <button role="tab" data-tab="deudas" aria-selected="false">Deudas</button>
    <button role="tab" data-tab="fijos" aria-selected="false">Pagos fijos</button>
    <button role="tab" data-tab="presupuesto" aria-selected="false">Presupuesto</button>
    <button role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>

  <main id="view"></main>
</div>

<button class="fab" id="fab">+ Registrar</button>
<div id="modalRoot"></div>
<div class="tip" id="tip" hidden></div>

<script type="module">
/* ====== CONFIGURACIÓN DE FIREBASE (proyecto finanzas-hogar-b15db) ======
   Estos datos son públicos por diseño; la seguridad la dan las reglas de Firestore. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBVFHAAOQ0gUOYTeHKuA_EvtHAJ_oBHv4U",
  authDomain: "finanzas-hogar-b15db.firebaseapp.com",
  projectId: "finanzas-hogar-b15db",
  storageBucket: "finanzas-hogar-b15db.firebasestorage.app",
  messagingSenderId: "562765821200",
  appId: "1:562765821200:web:aa25e8bf8892e3bd96a195"
};
/* ======================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

(function(){
"use strict";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const MXN = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:2,minimumFractionDigits:2});
const MXN0 = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
const money = n => MXN.format(n||0);
const money0 = n => MXN0.format(n||0);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const monthOf = f => (f||"").slice(0,7);
const addMonth = (ym,k) => { let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+"-"+pad(m); };
const monthLabel = (ym,short) => { const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("es-MX",short?{month:"short"}:{month:"long",year:"numeric"}); };
const daysIn = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };
const dayLabel = f => { const [y,m,d]=f.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}); };
const fechaCorta = f => { if(!f) return "—"; const [y,m,d]=f.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}); };
const fechaHora = iso => { if(!iso) return "sin dato"; const d=new Date(iso); return isNaN(d)?"sin dato":d.toLocaleString("es-MX",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}); };
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?Math.round(n*100)/100:0; };
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

const DEFAULT_CFG = {
  personas:["Yo","Mi esposa"],
  catGasto:["Súper y despensa","Comida fuera","Gasolina y transporte","Renta o hipoteca","Luz, agua y gas","Internet y celular","Salud","Escuela y colegiaturas","Hijos","Ropa","Hogar y mantenimiento","Entretenimiento","Mascotas","Regalos","Otros gastos"],
  catIngreso:["Sueldo","Negocio","Honorarios","Procesos migratorios","Procesos penales","Alojamiento","Ventas","Otros ingresos"],
  cuentas:[{id:"efectivo",nombre:"Efectivo en casa",saldoInicial:0,catAuto:""},{id:"banco",nombre:"Cuenta bancaria",saldoInicial:0,catAuto:""},{id:"migratorios",nombre:"Cuenta Procesos Migratorios",saldoInicial:0,catAuto:"Procesos migratorios"},{id:"penales",nombre:"Cuenta Procesos Penales",saldoInicial:0,catAuto:"Procesos penales"},{id:"alojamiento",nombre:"Cuenta Alojamiento",saldoInicial:0,catAuto:"Alojamiento"}],
  migraciones:["alojamiento"],
  presupuesto:{}
};
const ABONO_CAT = "Abonos a deudas";
const cuentaNom = id => { if(!id) return ""; const c=(S.cfg.cuentas||[]).find(x=>x.id===id); return c?c.nombre:"Cuenta eliminada"; };
const cuentaTxt = m => m.tipo==="traspaso" ? (cuentaNom(m.cuenta)||"?")+" → "+(cuentaNom(m.cuentaDestino)||"?") : m.cuenta ? (m.tipo==="ingreso"?"Entró a: ":"Salió de: ")+cuentaNom(m.cuenta) : "Sin cuenta";
function saldoCuenta(id){ const c=(S.cfg.cuentas||[]).find(x=>x.id===id); let s=c?(+c.saldoInicial||0):0; for(const m of S.movs){ if(m.tipo==="traspaso"){ if(m.cuenta===id) s-=m.monto; if(m.cuentaDestino===id) s+=m.monto; } else if(m.cuenta===id){ s+= m.tipo==="ingreso"?m.monto:-m.monto; } } return Math.round(s*100)/100; }
function flujoCuenta(id,ym){ let ent=0,sal=0; for(const m of movsMes(ym)){ if(m.tipo==="traspaso"){ if(m.cuenta===id) sal+=m.monto; if(m.cuentaDestino===id) ent+=m.monto; } else if(m.cuenta===id){ if(m.tipo==="ingreso") ent+=m.monto; else sal+=m.monto; } } return {ent,sal}; }
const DEBT_TYPES = ["Tarjeta de crédito","Préstamo personal","Crédito de auto","Hipoteca / Infonavit","Préstamo familiar","Tienda departamental","Otro"];

/* ---------- estado ---------- */
const S = {
  db:null, ready:false, readOnly:false,
  movs:[], deudas:[], fijos:[], cfg:structuredClone(DEFAULT_CFG), cfgExists:false,
  mes: monthOf(todayStr()),
  tab: "resumen",
  filt:{tipo:"", quien:"", q:"", cuenta:""}
};
try{ const t = store.get("fh-tab"); if(t) S.tab=t; }catch(e){}
const h = location.hash.replace("#",""); if(["resumen","movs","cuentas","deudas","fijos","presupuesto","ajustes"].includes(h)) S.tab=h;

/* ---------- cálculos ---------- */
const movsMes = ym => S.movs.filter(m=>monthOf(m.fecha)===ym);
function totales(ym){
  let ing=0,gas=0,abo=0;
  for(const m of movsMes(ym)){ if(m.tipo==="ingreso") ing+=m.monto; else if(m.tipo==="abono") abo+=m.monto; else if(m.tipo==="gasto") gas+=m.monto; }
  return {ing,gas,abo,egr:gas+abo,bal:ing-gas-abo};
}
function deudaInfo(d){
  const abonos = S.movs.filter(m=>m.tipo==="abono" && m.deudaId===d.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const pagado = abonos.reduce((s,m)=>s+m.monto,0);
  const ini = d.montoInicial||0;
  const saldo = Math.max(0, Math.round((ini-pagado)*100)/100);
  const pct = ini>0 ? Math.min(100, pagado/ini*100) : 0;
  const meses = d.pagoMensual>0 && saldo>0 ? Math.ceil(saldo/d.pagoMensual) : null;
  return {abonos,pagado,saldo,pct,meses,ultimo:abonos[0]};
}
function gastosPorCat(ym){
  const map = {};
  for(const m of movsMes(ym)){ if(m.tipo==="ingreso"||m.tipo==="traspaso") continue; const c = m.tipo==="abono"?ABONO_CAT:(m.categoria||"Otros gastos"); map[c]=(map[c]||0)+m.monto; }
  return map;
}
/* compromisos del mes: pagos fijos + pagos de deudas */
function compromisos(ym){
  const out=[]; const hoy=todayStr(); const dim=daysIn(ym);
  for(const f of S.fijos){
    if(f.activo===false) continue;
    const dia=Math.min(f.dia||1,dim); const fecha=ym+"-"+pad(dia);
    const pago = S.movs.find(m=>m.recurrenteId===f.id && monthOf(m.fecha)===ym);
    out.push({kind:"fijo",ref:f,nombre:f.nombre,monto:f.monto,fecha,pagado:!!pago,pagoMov:pago,vencido:!pago && fecha<hoy});
  }
  for(const d of S.deudas){
    const inf=deudaInfo(d); if(inf.saldo<=0 || !d.diaPago) continue;
    const dia=Math.min(d.diaPago,dim); const fecha=ym+"-"+pad(dia);
    const pago = inf.abonos.find(m=>monthOf(m.fecha)===ym);
    out.push({kind:"deuda",ref:d,nombre:d.nombre,monto:d.pagoMensual||0,fecha,pagado:!!pago,pagoMov:pago,vencido:!pago && fecha<hoy});
  }
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function estadoPill(c){
  if(c.pagado) return '<span class="pill good">✓ Pagado</span>';
  if(c.vencido) return '<span class="pill bad">! Vencido</span>';
  const dias = Math.round((new Date(c.fecha+"T00:00")-new Date(todayStr()+"T00:00"))/864e5);
  if(dias<=5 && dias>=0) return '<span class="pill warn">En '+dias+(dias===1?" día":" días")+'</span>';
  return '<span class="pill neutral">Pendiente</span>';
}

/* ---------- render ---------- */
function render(){
  $("#mlabel").textContent = monthLabel(S.mes);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  const v = $("#view");

  v.innerHTML = (S.readOnly?'<p class="notice warn">Tu cuenta no tiene permiso para guardar. Pide que agreguen tu correo a la lista de acceso.</p>':"") + views[S.tab]();
  bindView();
}

function vResumen(){
  const t = totales(S.mes); const prev = totales(addMonth(S.mes,-1));
  const deudaTotal = S.deudas.reduce((s,d)=>s+deudaInfo(d).saldo,0);
  const deudasAct = S.deudas.filter(d=>deudaInfo(d).saldo>0).length;
  const diff = prev.egr>0 ? ((t.egr-prev.egr)/prev.egr*100) : null;
  const ahorro = t.ing>0 ? (t.bal/t.ing*100) : null;
  const dispTotal=(S.cfg.cuentas||[]).reduce((s,c)=>s+saldoCuenta(c.id),0), ncta=(S.cfg.cuentas||[]).length;

  let html = `<div class="kpis">
    <div class="kpi"><div class="label">Ingresos</div><div class="v">${money0(t.ing)}</div><div class="s">${movsMes(S.mes).filter(m=>m.tipo==="ingreso").length} registros</div></div>
    <div class="kpi"><div class="label">Egresos</div><div class="v">${money0(t.egr)}</div><div class="s">${diff===null?"Sin mes anterior para comparar":(diff>=0?"▲ ":"▼ ")+Math.abs(diff).toFixed(0)+"% vs mes anterior"}</div></div>
    <div class="kpi"><div class="label">Dinero disponible</div><div class="v" style="color:${dispTotal<0?"var(--bad)":"var(--ink)"}">${money0(dispTotal)}</div><div class="s">Suma de lo que hay hoy en tus ${ncta} cuentas · balance del mes ${t.bal<0?"−":"+"}${money0(Math.abs(t.bal))}</div></div>
    <div class="kpi"><div class="label">Deuda total</div><div class="v">${money0(deudaTotal)}</div><div class="s">${deudasAct} ${deudasAct===1?"deuda activa":"deudas activas"} · abonado este mes ${money0(t.abo)}</div></div>
  </div>`;

  /* alertas */
  const alerts=[];
  const gpc=gastosPorCat(S.mes);
  for(const [c,lim] of Object.entries(S.cfg.presupuesto||{})){ if(!lim) continue; const g=gpc[c]||0; if(g>lim) alerts.push(`<span class="pill bad">Excedido</span> ${esc(c)}: ${money0(g)} de ${money0(lim)}`); else if(g>=lim*.85) alerts.push(`<span class="pill warn">Casi al límite</span> ${esc(c)}: ${money0(g)} de ${money0(lim)}`); }
  const comp = compromisos(S.mes);
  const sinCta=movsMes(S.mes).filter(m=>!m.cuenta&&m.tipo!=="traspaso").length; if(sinCta) alerts.push(`<span class="pill warn">Sin cuenta</span> ${sinCta} movimiento${sinCta===1?"":"s"} de este mes sin cuenta asignada; no se descuenta${sinCta===1?"":"n"} de ninguna cuenta. Ábrelo${sinCta===1?"":"s"} en Movimientos y elige la cuenta.`);
  for(const c of (S.cfg.cuentas||[])){ const sc=saldoCuenta(c.id); if(sc<0) alerts.push(`<span class="pill bad">En negativo</span> ${esc(c.nombre)}: ${money0(sc)}. ${c.saldoInicial?"Revisa los movimientos de esta cuenta.":"Falta escribir su saldo inicial en Ajustes → Cuentas."}`); }
  const venc = comp.filter(c=>c.vencido); if(venc.length) alerts.push(`<span class="pill bad">Vencido</span> ${venc.map(c=>esc(c.nombre)).join(", ")}`);

  html += `<div class="grid2">
   <section class="block">
     <div class="block-head"><h2>Gastos por categoría</h2><span class="muted small">la línea marca el presupuesto</span></div>
     ${alerts.length?`<div class="panel" style="display:flex;flex-direction:column;gap:8px">${alerts.map(a=>`<div class="small">${a}</div>`).join("")}</div>`:""}
     ${catBars(gpc)}
     <div class="block-head" style="margin-top:12px"><h2>Ingresos y egresos, 6 meses</h2>
       <div class="legend"><span><i style="background:var(--inc)"></i>Ingresos</span><span><i style="background:var(--exp)"></i>Egresos</span></div></div>
     <div class="chart" id="trend">${trendSVG()}</div>
   </section>
   <section class="block">
     <div class="block-head"><h2>Dinero por cuenta</h2><button class="btn" data-go="cuentas">Ver cuentas</button></div>
     <div class="panel">${(S.cfg.cuentas||[]).map(c=>{const s=saldoCuenta(c.id);return `<div class="item"><div><div class="t">${esc(c.nombre)}</div></div><div class="m" style="color:${s<0?"var(--bad)":"var(--ink)"}">${money0(s)}</div></div>`}).join("")||`<p class="muted small" style="margin:0">Sin cuentas</p>`}</div>
     <div class="block-head"><h2>Pagos del mes</h2><button class="btn" data-go="fijos">Ver todos</button></div>
     ${comp.length?`<div class="list">${comp.map(c=>`
        <div class="item"><div><div class="t">${esc(c.nombre)}</div><div class="d">${c.kind==="deuda"?"Pago de deuda":"Pago fijo"} · día ${+c.fecha.slice(8)} ${estadoPill(c)}</div></div>
        <div class="m">${money0(c.monto)}${!c.pagado&&!S.readOnly?`<div><button class="btn" style="margin-top:4px;padding:4px 10px;font-size:.78rem" data-pay="${c.kind}:${c.ref.id}">Marcar pagado</button></div>`:""}</div></div>`).join("")}</div>`
       : `<div class="empty"><strong>Sin pagos programados</strong><span>Agrega renta, luz, internet o mensualidades en Pagos fijos y aquí verás cuáles faltan.</span></div>`}

function catBars(gpc){
  const pres = S.cfg.presupuesto||{};
  const cats = new Set([...Object.keys(gpc), ...Object.keys(pres).filter(k=>pres[k]>0)]);
  const rows = [...cats].map(c=>({c,g:gpc[c]||0,p:pres[c]||0})).sort((a,b)=>b.g-a.g||b.p-a.p);
  if(!rows.length) return `<div class="empty"><strong>Sin gastos este mes</strong><span>Cuando registren gastos, aquí verán en qué se va el dinero.</span></div>`;
  const max = Math.max(...rows.map(r=>Math.max(r.g,r.p)),1);
  return `<div class="panel">${rows.map(r=>{
    const w=r.g/max*100, bm=r.p/max*100;
    const cls = r.p ? (r.g>r.p?"over":(r.g>=r.p*.85?"near":"")) : "";
    const meta = r.p ? (r.g>r.p?`Excedido por ${money0(r.g-r.p)} · presupuesto ${money0(r.p)}`:`Quedan ${money0(r.p-r.g)} de ${money0(r.p)}`) : "Sin presupuesto";
    return `<div class="catrow" title="${esc(r.c)}: ${money(r.g)}"><span class="name">${esc(r.c)}</span><span class="amt">${money0(r.g)}</span>
      <div class="bar"><i class="${cls}" style="width:${w}%"></i>${r.p?`<b style="left:calc(${bm}% - 1px)"></b>`:""}</div><span class="meta">${meta}</span></div>`;
  }).join("")}</div>`;
}

function trendSVG(){
  const months=[]; for(let i=5;i>=0;i--) months.push(addMonth(S.mes,-i));
  const data = months.map(m=>({m,...totales(m)}));
  const maxV = Math.max(...data.map(d=>Math.max(d.ing,d.egr)),0);
  if(maxV===0) return `<div class="empty"><span>La gráfica aparece en cuanto haya movimientos.</span></div>`;
  const step = niceStep(maxV/4); const top = Math.ceil(maxV/step)*step;
  const W=640,H=240,L=64,R=8,T=12,B=30, pw=W-L-R, ph=H-T-B, gw=pw/6, bw=Math.min(28,gw*0.3);
  const y=v=>T+ph-(v/top*ph);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos de los últimos 6 meses">`;
  for(let v=0; v<=top+0.001; v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money0(v)}</text>`; }
  data.forEach((d,i)=>{
    const cx=L+gw*i+gw/2; const x1=cx-bw-1, x2=cx+1;
    s+=barPath(x1,y(d.ing),bw,y(0),"var(--inc)")+barPath(x2,y(d.egr),bw,y(0),"var(--exp)");
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12" fill="${d.m===S.mes?"var(--ink)":"var(--muted)"}" font-weight="${d.m===S.mes?700:400}">${monthLabel(d.m,true)}</text>`;
    s+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" fill="transparent" data-tip="${esc(monthLabel(d.m))}|${d.ing}|${d.egr}"/>`;
  });
  return s+`</svg>`;
}
function barPath(x,yTop,w,yBase,fill){
  const h=yBase-yTop; if(h<=0.5) return "";
  const r=Math.min(4,h,w/2);
  return `<path d="M${x},${yBase} V${yTop+r} Q${x},${yTop} ${x+r},${yTop} H${x+w-r} Q${x+w},${yTop} ${x+w},${yTop+r} V${yBase} Z" fill="${fill}"/>`;
}
function niceStep(v){ const p=Math.pow(10,Math.floor(Math.log10(v||1))); const f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

function quincenas(){
  let q1=0,q2=0; for(const m of movsMes(S.mes)){ if(m.tipo==="ingreso"||m.tipo==="traspaso") continue; (+m.fecha.slice(8)<=15)? q1+=m.monto : q2+=m.monto; }
  const tot=q1+q2||1;
  return `<div class="panel">
    <div class="catrow"><span class="name">1ª quincena (1–15)</span><span class="amt">${money0(q1)}</span><div class="bar"><i style="width:${q1/tot*100}%;background:var(--exp)"></i></div></div>
    <div class="catrow"><span class="name">2ª quincena (16–${daysIn(S.mes)})</span><span class="amt">${money0(q2)}</span><div class="bar"><i style="width:${q2/tot*100}%;background:var(--exp)"></i></div></div>
  </div>`;
}
function porPersona(){
  const ms=movsMes(S.mes); if(!ms.length) return `<p class="muted small">Sin registros este mes.</p>`;
  const ps=[...new Set([...S.cfg.personas, ...ms.map(m=>m.quien).filter(Boolean)])];
  return `<div class="panel">${ps.map(p=>{
    const g=ms.filter(m=>m.quien===p&&m.tipo!=="ingreso"&&m.tipo!=="traspaso").reduce((s,m)=>s+m.monto,0);
    const i=ms.filter(m=>m.quien===p&&m.tipo==="ingreso").reduce((s,m)=>s+m.monto,0);
    return `<div class="item"><div><div class="t">${esc(p)}</div><div class="d">Ingresó ${money0(i)}</div></div><div class="m">Gastó ${money0(g)}</div></div>`;
  }).join("")}</div>`;
}

function vMovs(){
  const f=S.filt; const q=f.q.trim().toLowerCase();
  let ms=movsMes(S.mes).filter(m=>(!f.tipo||m.tipo===f.tipo)&&(!f.quien||m.quien===f.quien)&&(!f.cuenta||m.cuenta===f.cuenta||m.cuentaDestino===f.cuenta)&&(!q||(m.desc+" "+m.categoria).toLowerCase().includes(q)));

  </div>

  if(!ms.length) return html+`<div class="empty" style="margin-top:14px"><strong>No hay movimientos ${f.tipo||f.quien||q?"con esos filtros":"en "+monthLabel(S.mes)}</strong><span>Usa “+ Registrar” para agregar uno.</span></div>`;

    html+=`<div class="item click" data-edit="${m.id}" tabindex="0"><div><div class="t">${esc(m.desc||cat)}</div>
      <div class="d"><span class="pill ${m.tipo==="ingreso"?"good":"neutral"}">${esc(cat)}</span>${m.quien?`<span>${esc(m.quien)}</span>`:""}<span>${esc(cuentaTxt(m))}</span>${(m.comprobantes||[]).length?`<span class="pill neutral">${m.comprobantes.length} comprobante${m.comprobantes.length===1?"":"s"}</span>`:""}</div>
      <div class="d"><span>${m.tipo==="ingreso"?"Se recibió":m.tipo==="traspaso"?"Se hizo":"Se pagó"}: ${fechaCorta(m.fecha)}</span><span>· Registrado: ${fechaHora(m.creado)}</span></div></div>
      <div class="m ${m.tipo==="ingreso"?"pos":"neg"}">${m.tipo==="ingreso"?"+":m.tipo==="traspaso"?"":"−"}${money(m.monto)}</div></div>`;
  }
  return html+`</div>`;
}

function vCuentas(){
  const cs=S.cfg.cuentas||[]; const total=cs.reduce((s,c)=>s+saldoCuenta(c.id),0);
  const sinCuenta=movsMes(S.mes).filter(m=>!m.cuenta && m.tipo!=="traspaso").length;
  let html=`<div class="block-head" style="margin-bottom:14px"><div><h2>Cuentas</h2><p class="muted small" style="margin:2px 0 0">Dinero total ${money(total)} · saldos con todos los movimientos registrados</p></div>${S.readOnly?"":`<button class="btn" data-go="ajustes">Editar cuentas</button>`}</div>`;
  if(sinCuenta) html+=`<p class="notice warn" style="margin:0 0 14px">${sinCuenta} movimiento${sinCuenta===1?"":"s"} de ${monthLabel(S.mes)} sin cuenta asignada. Ábrelos en Movimientos para indicar de dónde salió o a dónde entró el dinero.</p>`;
  if(!cs.length) return html+`<div class="empty"><strong>No hay cuentas</strong><span>Agrégalas en Ajustes.</span></div>`;
  html+=`<div class="cards">`;
  for(const c of cs){ const s=saldoCuenta(c.id), fl=flujoCuenta(c.id,S.mes);
    html+=`<div class="debt"><div class="top"><div style="min-width:0"><h3>${esc(c.nombre)}</h3>${c.catAuto?`<div class="muted small">Aquí entran los ingresos de: ${esc(c.catAuto)}</div>`:""}</div></div>
      <div><div class="label">Saldo actual</div><div class="saldo" style="color:${s<0?"var(--bad)":"var(--ink)"}">${money(s)}</div></div>
      <div class="facts"><div><span>Entró en ${monthLabel(S.mes,true)}</span>${money0(fl.ent)}</div><div><span>Salió en ${monthLabel(S.mes,true)}</span>${money0(fl.sal)}</div></div>
      <div class="row-actions"><button class="btn" data-vercuenta="${c.id}">Ver movimientos</button>${S.readOnly?"":`<button class="btn" data-traspaso="${c.id}">Traspasar</button>`}</div></div>`; }
  return html+`</div>`;
}

function vDeudas(){
  const act=S.deudas.map(d=>({d,i:deudaInfo(d)})).sort((a,b)=>(a.i.saldo<=0)-(b.i.saldo<=0)||b.i.saldo-a.i.saldo);
  const tot=act.reduce((s,x)=>s+x.i.saldo,0), pag=act.reduce((s,x)=>s+x.i.pagado,0), mens=act.filter(x=>x.i.saldo>0).reduce((s,x)=>s+(x.d.pagoMensual||0),0);

      <div class="small muted">${i.pct.toFixed(0)}% pagado de ${money0(d.montoInicial)}</div>

  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{ const [k,i]=b.dataset.rm.split(":"); const arr=S.cfg[k].filter((_,j)=>j!=i); await saveCfg({...S.cfg,[k]:arr},"Categoría quitada"); });
  v.querySelectorAll("[data-fondo]").forEach(b=>b.onclick=()=>{ const r=document.documentElement; r.dataset.fondo=b.dataset.fondo; if(b.dataset.fondo==="clasico") delete r.dataset.theme; else r.dataset.theme="light"; store.set("fh-fondo",b.dataset.fondo); render(); });
  const readCtas=()=>(S.cfg.cuentas||[]).map((c,i)=>({...c,nombre:($("#cn-"+i)?.value||"").trim()||c.nombre,saldoInicial:num($("#cs-"+i)?.value||0),catAuto:$("#cc-"+i)?.value||""}));

    const csv=rows.map(r=>r.map(x=>{x=String(x??"");return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")).join("\n");

    r.addEventListener("mouseleave",()=>tip.hidden=true);
  });
}

function payCommitment(kind,id){
  if(kind==="fijo"){ const f=S.fijos.find(x=>x.id===id); if(!f) return; const dia=Math.min(f.dia||1,daysIn(S.mes)); const fecha = monthOf(todayStr())===S.mes?todayStr():S.mes+"-"+pad(dia);
    openMov(null,{tipo:"gasto",categoria:f.categoria,monto:f.monto,desc:f.nombre,recurrenteId:f.id,fecha,quien:f.quien}); }
  else { const d=S.deudas.find(x=>x.id===id); if(!d) return; const fecha = monthOf(todayStr())===S.mes?todayStr():S.mes+"-"+pad(Math.min(d.diaPago||1,daysIn(S.mes)));
    openMov(null,{tipo:"abono",deudaId:d.id,monto:d.pagoMensual,fecha}); }
}

function closeModal(){ $("#modalRoot").innerHTML=""; }
function modal(title,inner,onMount){

function verImagen(src){ if(!src) return; const v=document.createElement("div"); v.className="viewer"; v.setAttribute("role","dialog"); v.setAttribute("aria-label","Comprobante, toca para cerrar"); const im=document.createElement("img"); im.src=src; im.alt="Comprobante"; v.appendChild(im); v.onclick=()=>v.remove(); document.body.appendChild(v); }
async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    for(const max of [1600,1250,950,700]){
      const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      for(const q of [0.72,0.6,0.48]){ const out=c.toDataURL("image/jpeg",q); if(out.length<650000) return out; }
    }
    throw new Error("muy grande");
  } finally { URL.revokeObjectURL(url); }
}

    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ const prev=tipo; tipo=b.dataset.t; if((prev==="ingreso")!==(tipo==="ingreso")) $("#mCat").innerHTML=catOpts(tipo); sync(); autoCta(); });
    sync();
    const thumbsEl=$("#thumbs"), keep=[...(d.comprobantes||[])], nuevos=[], quitar=[], cache={};
    const drawThumbs=()=>{
      thumbsEl.innerHTML = keep.map(id=>`<div class="thumb">${cache[id]?`<img src="${esc(cache[id])}" data-ver="${esc(id)}" alt="Comprobante">`:`<span class="load">Cargando…</span>`}<button type="button" data-qk="${esc(id)}" aria-label="Quitar comprobante">×</button></div>`).join("")
        + nuevos.map((n,i)=>`<div class="thumb"><img src="${n}" data-vern="${i}" alt="Comprobante nuevo"><button type="button" data-qn="${i}" aria-label="Quitar comprobante">×</button></div>`).join("")
        || `<span class="muted small">Sin comprobantes. Puedes tomar una foto o elegirla de tu galería.</span>`;
      thumbsEl.querySelectorAll("[data-ver]").forEach(i=>i.onclick=()=>verImagen(cache[i.dataset.ver]));
      thumbsEl.querySelectorAll("[data-vern]").forEach(i=>i.onclick=()=>verImagen(nuevos[+i.dataset.vern]));
      thumbsEl.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{ const id=b.dataset.qk; const k=keep.indexOf(id); if(k>=0) keep.splice(k,1); quitar.push(id); drawThumbs(); });
      thumbsEl.querySelectorAll("[data-qn]").forEach(b=>b.onclick=()=>{ nuevos.splice(+b.dataset.qn,1); drawThumbs(); });
    };
    drawThumbs();
    keep.forEach(id=>S.db.doc("comprobantes/"+id).get().then(sn=>{ cache[id]=sn.exists?sn.data().img:""; if(!sn.exists){ const k=keep.indexOf(id); if(k>=0) keep.splice(k,1); } drawThumbs(); }).catch(()=>{}));
    $("#mFotoBtn").onclick=()=>$("#mFoto").click();
    $("#mFoto").onchange=async e=>{ const files=[...e.target.files]; e.target.value=""; for(const f of files){ if(f.type && !f.type.startsWith("image/")){ toast("Solo se pueden agregar imágenes"); continue; } try{ nuevos.push(await comprimir(f)); drawThumbs(); }catch(err){ toast("No se pudo leer esa imagen"); } } };
    const autoCta=()=>{ if(tipo!=="ingreso") return; const ac=(S.cfg.cuentas||[]).find(c=>c.catAuto && c.catAuto===$("#mCat").value); if(ac) $("#mCuenta").value=ac.id; }; $("#mCat").addEventListener("change",autoCta); if(!m) autoCta();
    $("#mCancel").onclick=closeModal;
    if(m) armDelete($("#mDel"),async()=>{ if(await write(()=>S.db.doc("movs/"+m.id).delete())){ (m.comprobantes||[]).forEach(id=>write(()=>S.db.doc("comprobantes/"+id).delete())); closeModal(); toast("Movimiento eliminado"); } });
    $("#fm").onsubmit=async e=>{ e.preventDefault();
      const monto=num($("#mMonto").value); const err=$("#mErr");
      if(monto<=0){ err.textContent="Escribe un monto mayor a cero."; err.hidden=false; return; }
      if(tipo==="abono" && !$("#mDeuda").value){ err.textContent="Agrega primero la deuda en la pestaña Deudas."; err.hidden=false; return; }
      if(tipo==="traspaso" && (!$("#mCuenta").value || !$("#mDest").value || $("#mCuenta").value===$("#mDest").value)){ err.textContent="Elige dos cuentas distintas para el traspaso."; err.hidden=false; return; }
      const fecha=$("#mFecha").value||todayStr();
      const body={tipo,monto,fecha,desc:$("#mDesc").value.trim(),quien:$("#mQuien").value,
        categoria: tipo==="abono"?ABONO_CAT:tipo==="traspaso"?"Traspaso":$("#mCat").value, cuenta:$("#mCuenta").value||null, cuentaDestino: tipo==="traspaso"?($("#mDest").value||null):null, deudaId: tipo==="abono"?$("#mDeuda").value:null,
        recurrenteId: d.recurrenteId||null, creado: d.creado||new Date().toISOString(), editado: m?new Date().toISOString():null};
      store.set("fh-quien",body.quien); if(body.cuenta && tipo!=="ingreso") store.set("fh-cta",body.cuenta);
      $("#mSave").disabled=true;
      const ref = m ? S.db.doc("movs/"+m.id) : S.db.collection("movs").doc();
      const newIds=[];
      for(const n of nuevos){ const rr=S.db.collection("comprobantes").doc(); if(!(await write(()=>rr.set({movId:ref.id,img:n,creado:new Date().toISOString()})))){ $("#mSave").disabled=false; return; } newIds.push(rr.id); }
      body.comprobantes=[...keep,...newIds];
      if(await write(()=>ref.set(body))){ for(const id of quitar) write(()=>S.db.doc("comprobantes/"+id).delete()); closeModal(); toast(m?"Cambios guardados":(tipo==="ingreso"?"Ingreso registrado":tipo==="abono"?"Abono registrado":tipo==="traspaso"?"Traspaso registrado":"Gasto registrado")); if(!m && monthOf(fecha)!==S.mes){ S.mes=monthOf(fecha); render(); } }
      else $("#mSave").disabled=false;
    };
  });
}

/* ---------- escritura ---------- */
/* Firestore guarda primero en el teléfono y sincroniza después; si no hay internet, no esperamos. */
function failWrite(e){
  if(e && e.code==="permission-denied"){ toast("Tu cuenta no tiene permiso para guardar"); }
  else toast("No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
  return false;
}
async function write(fn){
  if(!S.db){ toast("Inicia sesión para guardar."); return false; }
  let p; try{ p=fn(); }catch(e){ return failWrite(e); }
  const r=await Promise.race([p.then(()=>"ok",e=>({err:e})), new Promise(res=>setTimeout(()=>res("pending"),2500))]);
  if(r==="ok") return true;
  if(r==="pending"){ p.catch(failWrite); return true; }
  return failWrite(r.err);
}
async function saveCfg(next,msg){
  const body={personas:next.personas,catGasto:next.catGasto,catIngreso:next.catIngreso,presupuesto:next.presupuesto||{},cuentas:next.cuentas||[],migraciones:next.migraciones||[]};
  if(await write(()=>S.db.doc("config/hogar").set(body))){ toast(msg); }
}

let toastT;
function toast(msg){ let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800); }

/* ---------- navegación ---------- */
function setTab(t){ S.tab=t; store.set("fh-tab",t); render(); scrollTo({top:0}); }
$("#tabs").onclick=e=>{ const b=e.target.closest("button[data-tab]"); if(b) setTab(b.dataset.tab); };
$("#prevM").onclick=()=>{S.mes=addMonth(S.mes,-1);render()};
$("#nextM").onclick=()=>{S.mes=addMonth(S.mes,1);render()};
$("#fab").onclick=()=>openMov(null);

/* ---------- conexión (Firebase) ---------- */
render();
const st=$("#status"), login=$("#login"), loginMsg=$("#loginMsg"), loginBtn=$("#loginBtn"), loginOther=$("#loginOther"), logoutBtn=$("#logout");
function showLogin(msg,other){ login.hidden=false; loginMsg.textContent=msg; loginBtn.hidden=!!other; loginOther.hidden=!other; }
if(FIREBASE_CONFIG.apiKey.startsWith("PEGA")){ showLogin("Falta configurar Firebase: pega los datos de tu proyecto al inicio del código (FIREBASE_CONFIG)."); loginBtn.hidden=true; return; }

const app=initializeApp(FIREBASE_CONFIG);
const auth=getAuth(app); auth.languageCode="es";
let fdb;
try{ fdb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
catch(e){ fdb=initializeFirestore(app,{}); }

/* adaptador: misma forma que usa el resto de la app */
const wrapRef=r=>({ id:r.id, get:()=>getDoc(r).then(s=>({exists:s.exists(),data:()=>s.data()})), set:b=>setDoc(r,b), delete:()=>deleteDoc(r),
  onSnapshot:(n,e)=>onSnapshot(r,s=>n({exists:s.exists(),data:()=>s.data()}),e) });
const DB={
  doc:p=>wrapRef(doc(fdb,p)),
  collection:p=>{ const c=collection(fdb,p); return { doc:id=>wrapRef(id?doc(c,id):doc(c)),
    onSnapshot:(n,e)=>onSnapshot(c,s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e) }; }
};

const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
async function doLogin(){
  loginBtn.disabled=true;
  try{ await signInWithPopup(auth,provider); }
  catch(e){
    if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){ await signInWithRedirect(auth,provider); return; }
    if(e && e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request") loginMsg.textContent="No se pudo iniciar sesión ("+(e.code||"error")+"). Inténtalo de nuevo.";
  }
  loginBtn.disabled=false;
}
loginBtn.onclick=doLogin;
loginOther.onclick=async()=>{ await signOut(auth); doLogin(); };
logoutBtn.onclick=()=>signOut(auth);
getRedirectResult(auth).catch(()=>{});

let unsubs=[];
onAuthStateChanged(auth,user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  if(!user){ S.db=null; S.ready=false; S.movs=[]; S.deudas=[]; S.fijos=[]; logoutBtn.hidden=true; st.textContent="Sin sesión"; render(); showLogin("Entra con tu cuenta de Google para ver y registrar los gastos de la casa."); return; }
  login.hidden=true; logoutBtn.hidden=false; S.db=DB; S.readOnly=false;
  st.textContent="Cargando…";
  const loaded={movs:false,deudas:false,fijos:false,cfg:false};
  const done=()=>{ if(Object.values(loaded).every(Boolean)) S.ready=true; st.textContent=(S.ready?(navigator.onLine?"En línea":"Sin internet · se sincroniza al volver")+" · "+user.email:"Cargando…"); render(); };
  const onErr=e=>{
    if(e && e.code==="permission-denied"){ showLogin("La cuenta "+user.email+" no tiene acceso a estas finanzas. Entra con la cuenta autorizada.",true); }
    else st.textContent="Se perdió la conexión con los datos. Recarga la página.";
  };
  unsubs.push(DB.collection("movs").onSnapshot(s=>{ S.movs=s.docs.map(d=>{const x=d.data();return {id:d.id,...x,monto:+x.monto||0}}); loaded.movs=true; done(); },onErr));
  unsubs.push(DB.collection("deudas").onSnapshot(s=>{ S.deudas=s.docs.map(d=>({id:d.id,...d.data()})); loaded.deudas=true; done(); },onErr));
  unsubs.push(DB.collection("fijos").onSnapshot(s=>{ S.fijos=s.docs.map(d=>({id:d.id,...d.data()})); loaded.fijos=true; done(); },onErr));
  unsubs.push(DB.doc("config/hogar").onSnapshot(s=>{ if(s.exists){ const x=s.data(); S.cfg={personas:x.personas?.length?[...x.personas]:[...DEFAULT_CFG.personas],catGasto:x.catGasto?.length?[...x.catGasto]:[...DEFAULT_CFG.catGasto],catIngreso:x.catIngreso?.length?[...x.catIngreso]:[...DEFAULT_CFG.catIngreso],presupuesto:{...(x.presupuesto||{})},cuentas:Array.isArray(x.cuentas)&&x.cuentas.length?x.cuentas.map(c=>({...c})):structuredClone(DEFAULT_CFG.cuentas)}; if(!Array.isArray(x.cuentas)){ for(const c of ["Procesos migratorios","Procesos penales"]) if(!S.cfg.catIngreso.includes(c)) S.cfg.catIngreso.splice(Math.max(0,S.cfg.catIngreso.length-1),0,c); } S.cfg.migraciones=Array.isArray(x.migraciones)?[...x.migraciones]:[]; if(!S.cfg.migraciones.includes("alojamiento")){ if(!S.cfg.catIngreso.includes("Alojamiento")) S.cfg.catIngreso.splice(Math.max(0,S.cfg.catIngreso.length-1),0,"Alojamiento"); if(!S.cfg.cuentas.some(c=>c.id==="alojamiento")) S.cfg.cuentas.push({id:"alojamiento",nombre:"Cuenta Alojamiento",saldoInicial:0,catAuto:"Alojamiento"}); S.cfg.migraciones.push("alojamiento"); } S.cfgExists=true; } loaded.cfg=true; done(); },onErr));
});
addEventListener("online",()=>render()); addEventListener("offline",()=>{ st.textContent="Sin internet · se sincroniza al volver"; });
})();
</script>
